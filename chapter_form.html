{% extends "base.html" %}
{% block title %}Thêm chương | Manga Dark{% endblock %}
{% block content %}
<div class="form-page panel">
  <p class="eyebrow">ĐĂNG CHƯƠNG MỚI</p>
  <h1>{{ comic.title }}</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <label>Số chương *<input name="chapter_number" type="number" step="0.1" min="0" required placeholder="Ví dụ: 1"></label>
      <label>Tên chương *<input name="title" required placeholder="Ví dụ: Khởi đầu"></label>
    </div>
    <label>Ảnh các trang truyện *<input type="file" name="pages" accept=".png,.jpg,.jpeg,.webp,.gif" multiple required></label>
    <p class="tiny muted">Chọn nhiều ảnh cùng lúc. Ảnh sẽ được hiển thị theo thứ tự bạn chọn. Tối đa 100 ảnh/chương, 12 MB/ảnh.</p>
    <div class="form-actions"><button class="btn primary">Đăng chương</button><a class="btn secondary" href="{{ url_for('dashboard') }}">Hủy</a></div>
  </form>
</div>
{% endblock %}
