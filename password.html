{% extends "base.html" %}
{% block title %}Đổi mật khẩu | Manga Dark{% endblock %}
{% block content %}
<div class="form-page panel narrow">
  <p class="eyebrow">BẢO MẬT</p><h1>Đổi mật khẩu quản trị</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Mật khẩu hiện tại<input type="password" name="old_password" required></label>
    <label>Mật khẩu mới<input type="password" name="new_password" minlength="10" required></label>
    <label>Nhập lại mật khẩu mới<input type="password" name="confirm_password" minlength="10" required></label>
    <button class="btn primary full">Cập nhật mật khẩu</button>
  </form>
</div>
{% endblock %}
